<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let fechaActual = new Date();
      let añoActual = fechaActual.getFullYear();

      let randomAño = Math.floor(Math.random() * (añoActual - 2000 + 1)) + 2000;
      let randomMes = Math.floor(Math.random() * (11 - 0 + 1)) + 0;
      let randomDia = Math.floor(Math.random() * (30 - 1 + 1)) + 1;

      let fechaRandom = new Date(randomAño, randomMes, randomDia);

      document.write(`${fechaRandom.toDateString()}`);
      alert(`${fechaRandom.toDateString()}`);

      console.log(randomAño);
      console.log(randomMes);
      console.log(randomDia);
    </script>
  </body>
</html>
