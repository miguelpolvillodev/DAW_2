<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let precio = prompt("Introduce precio del artículo");
      let cantidad = prompt(
        "Introduce cantidad de articulos que desea comprar",
      );
      let resultado = Number(precio) * Number(cantidad);
      console.log(resultado.toFixed(2));
    </script>
  </body>
</html>
