<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a = prompt("Escribe el primer valor numerico");
      let b = prompt("Escribe el segundo valor numerico");
      let suma = Number(a) + Number(b);
      let resta = Number(a) - Number(b);
      console.log(`La suma de ${a} y ${b} es ${suma}`);
      console.log(`La resta de ${a} y ${b} es ${resta}`);
    </script>
  </body>
</html>
