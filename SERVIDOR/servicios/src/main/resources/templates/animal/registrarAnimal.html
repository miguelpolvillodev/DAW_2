<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<style>
.error{
color: red;
}
</style>
<body>
<form method="POST" 
th:action="@{/animal/guardar}"
th:object="${animal}">
<p>
			<label for="especie">Especie</label>
			<input type="text" th:field="*{especie}">
			<span class="error" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></span>
		</p>
		<p>
			<label for="cantidad">Cantidad</label>
			<input type="number" th:field="*{cantidad}">
			<span class="error" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></span>
		</p>
		<p>
			<label for="precio">Precio</label>
			<input type="number" step="0.01" th:field="*{precio}">
			<span class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
		</p>
		<p>
			<label for="tipo">Tipo</label>
			<select th:field="*{tipo}">
				<option value="">Elige un tipo</option>
				<option value="Mamífero">Mamífero</option>
				<option value="Ave">Ave</option>
				<option value="Pez">Pez</option>
				<option value="Reptil">Reptil</option>
				<option value="Anfibio">Anfibio</option>
			</select>
			<span class="error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
		</p>
		<p>
			<input type="checkbox" th:field="*{oferta}">
			<label th:for="${#ids.prev('oferta')}">En oferta</label>
		</p>
		<p>
			<button type="submit">Guardar</button>
			<button th:href="@{/animal/todos}">Cancelar</button>
		</p>
	</form>
</body>
</html>
