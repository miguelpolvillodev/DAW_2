<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numero = prompt("Introduce un numero");
      let cifras = numero.length;
      document.write(
        `<div><p style="color:blue;"><i>Cifras del número: ${cifras}</i></p></div>`,
      );
    </script>
  </body>
</html>
