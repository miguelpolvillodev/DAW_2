<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${titulo}"></title>
</head>
<body>
    <h1 th:text="${cabecera}"></h1>

    <p th:if="${categoria == null}">No hay datos que mostrar</p>

    <div th:if="${categoria != null}">
        <ul>
            <li>Id: <span th:text="${categoria.id}"></span></li>
            <li>Nombre: <span th:text="${categoria.nombre}"></span></li>
            <li>Descripción: <span th:text="${categoria.descripcion}"></span></li>
        </ul>

        <h2>Productos de esta categoría</h2>

        <p th:if="${#lists.isEmpty(productos)}">
            Esta categoría no tiene productos asociados.
        </p>

        <table th:unless="${#lists.isEmpty(productos)}" border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.precio}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/categorias/lista}">Volver al listado</a>
</body>
</html>
