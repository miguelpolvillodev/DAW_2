<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<img th:src="@{/img/logo.png}">
<br>
<a th:href="@{/peliculas}">Cartelera</a><span> | </span><a th:href="@{/peliculas/nueva}">Nueva película</a>

<h1>Películas del cine</h1>

<form th:action="@{/peliculas}" method="get">
 <label>Género <select name="genero">
 <option value="">Todos</option>
 <option th:each="g : ${generos}" th:value="${g}" th:text="${g}"
 th:selected="${g == generoElegido}">ACCION</option>
 </select></label>
 <label><input type="checkbox" name="soloCartelera" value="true"
 th:checked="${soloCartelera}" /> Solo en cartelera</label>
 <button type="submit">Filtrar</button>
</form>
<p th:if="${#lists.isEmpty(listaPelis)}">
 No hay películas con ese filtro.</p>
<table border="1" th:unless="${#lists.isEmpty(listaPelis)}">
<thead>
<tr>
<th>Título</th>
<th>Año</th>
<th>Género</th>
<th>Recaudación</th>
<th>Cartelera</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
<tr th:each="p : ${listaPelis}">
<td><a th:href="@{/peliculas/{id}(id=${p.id})}" th:text="${p.titulo}"></a></td>
<td th:text="${p.anio}"></td>
<td th:text="${p.genero}"></td>
<td th:text="${p.recaudacion}"></td>
<td th:text="${p.enCartelera ? 'Sí' : 'No'}"></td>
<td>
<a th:href="@{/peliculas/editar/{id}(id=${p.id})}">Editar</a>

<form th:action="@{/peliculas/borrar/{id}(id=${p.id})}" method="post">
<button type="submit">Borrar</button>
</form>
</td>
</tr>
</tbody>

</table>

<footer th:replace="~{fragmentos/comun :: pie}">Pie</footer>

</body>
</html>
