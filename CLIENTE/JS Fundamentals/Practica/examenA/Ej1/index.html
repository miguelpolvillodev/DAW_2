<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo de Lotería</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js"></script>
</head>
<body>

  <header>
    <img src="img/loteria.png" alt="Logo Lotería" class="logo">
    <h1>SORTEO DE LA LOTERÍA NACIONAL</h1>
  </header>

  <main>
    <div class="fecha-container">
      <label>Fecha del sorteo:</label>
      <div id="fecha" class="fecha"></div>
    </div>

    <div class="numero-container">
      <input type="text" id="numero" readonly value="00000">
    </div>

    <div class="botones">
      <button id="btnIniciar">Iniciar sorteo</button>
      <button id="btnDetener" disabled>Detener</button>
      <button id="btnResumen" disabled>Ver resumen</button>
    </div>

    <div id="texto"></div>
    <div id="ganancia"></div>
  </main>

  <footer>
    <p>© 2025 Lotería Nacional - Todos los derechos reservados</p>
  </footer>

  
</body>
</html>
