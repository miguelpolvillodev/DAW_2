<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Liga de Superhéroes</title>
<link rel="stylesheet" href="css/style2.css">
</head>
<body>
<div class="container">
    <header>
        <img src="img/superheroe.jpg" alt="Logo Liga" class="logo">
        <h1>¡Únete a la Liga de Superhéroes!</h1>
    </header>

    <form id="formSuperheroes">
        <div class="form-group">
            <label for="nombre">Nombre de Superhéroe:</label>
            <input type="text" id="nombre">
            <span class="error" id="errorNombre"></span>
        </div>

        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad">
            <span class="error" id="errorEdad"></span>
        </div>

        <div class="form-group">
            <label for="poder">Superpoder principal:</label>
            <input type="text" id="poder">
            <span class="error" id="errorPoder"></span>
        </div>

        <div class="form-group">
            <label for="correo">Correo de contacto secreto:</label>
            <input type="email" id="correo">
            <span class="error" id="errorCorreo"></span>
        </div>

        <div class="form-group">
            <label for="password">Contraseña de la base secreta:</label>
            <input type="password" id="password">
            <span class="error" id="errorPassword"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña:</label>
            <input type="password" id="confirmPassword">
            <span class="error" id="errorConfirm"></span>
        </div>

        <button type="submit" id="btnEnviar">Enviar</button>
    </form>

    <div id="mensajeExito"></div>
</div>

<script src="js/heroes.js"></script>
</body>
</html>
