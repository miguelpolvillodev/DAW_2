<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- CAMBIO -->
<head>
<meta charset="UTF-8">
<title>Detalle sala</title>
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:if="${sala != null}">
	<h1 th:text="${sala.nombre}"></h1>
	<p th:text="|Planta: ${sala.planta}|"></p>
	<p th:text="|Aforo: ${sala.aforo}|"></p>
	<p th:text="|Email: ${sala.email}|"></p>
	<p th:text="|Estado: ${sala.estado}|"></p>
</div>
<p th:if="${sala == null}">Sala no encontrada</p>

<a th:href="@{/salas}">Volver</a>
</body>
</html>
