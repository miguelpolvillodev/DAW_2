<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>01 · Form elements</title>
</head>
<body>
  <h2>Datos personales</h2>
  <form id="formulario" name="formulario">
    <p>Fecha de nacimiento: <input type="date" id="fecha" name="fecha"></p>
    <p>Nombre: <input type="text" id="nombre" name="nombre" value="Miguel"></p>
    <p>Primer apellido: <input type="text" id="apellido1" name="ape1" value="García"></p>
    <p>Segundo apellido: <input type="text" id="apellido2" name="ape2" value="López"></p>
    <button type="button" id="btnNombres">Nombres</button>
    <button type="button" id="btnTexts">Solo text</button>
    <button type="button" id="btnId">Nombre completo (id)</button>
    <button type="button" id="btnName">Nombre completo (name)</button>
  </form>
  <script src="ejercicio.js"></script>
</body>
</html>
