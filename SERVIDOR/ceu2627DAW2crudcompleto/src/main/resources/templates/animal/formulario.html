<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${titulo}"></title>
</head>
<body>
	<h1 th:text="${titulo}"></h1>
	<h2 th:text="${subtitulo}"></h2>

	<form th:action="@{/animal/guardar}" th:object="${animal}" method="post">
		<!--/* El id viaja oculto en el formulario: con id = 0 se crea un animal nuevo,
			con otro id se actualiza ese animal. */-->
		<input type="hidden" th:field="*{id}">
		<p>
			<label for="especie">Especie</label>
			<input type="text" th:field="*{especie}">
		</p>
		<p>
			<label for="cantidad">Cantidad</label>
			<input type="number" th:field="*{cantidad}">
		</p>
		<p>
			<label for="precio">Precio</label>
			<input type="number" step="0.01" th:field="*{precio}">
		</p>
		<p>
			<label for="tipo">Tipo</label>
			<input type="text" th:field="*{tipo}">
		</p>
		<p>
			<input type="checkbox" th:field="*{oferta}">
			<label th:for="${#ids.prev('oferta')}">En oferta</label>
		</p>
		<p>
			<button type="submit" th:text="${boton}"></button>
			<a th:href="@{/animal/todos}">Cancelar</a>
		</p>
	</form>

</body>
</html>
