<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let dia = prompt("Dime tu dia en el que cumples años");
      let mes = prompt("Dime tu mes en el que cumples");

      for (let años = 2026; años < 2100; años++) {
        let fechaActual = new Date(años, mes - 1, dia);
        if (fechaActual.getDay() == 0) {
          document.write(
            `${fechaActual.getDate()} / ${fechaActual.getMonth() + 1} / ${fechaActual.getFullYear()} <br>`,
          );
        }
      }
    </script>
  </body>
</html>
